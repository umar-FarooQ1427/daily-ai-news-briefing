name: Daily AI News Collection and Analysis

on:
  schedule:
    # Daily at 08:00 Pakistan time (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-pages
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect news
        run: python news_collector.py

      - name: Verify Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing from repository secrets."
            exit 1
          fi
          echo "Gemini API key is available."

      - name: Analyze news with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: python ai_news_analyzer.py

      - name: Verify generated reports
        run: |
          test -s news.json || { echo "news.json is missing or empty"; exit 1; }
          test -s daily_briefing.md || { echo "daily_briefing.md is missing or empty"; exit 1; }
          test -s ai_briefing.md || { echo "ai_briefing.md is missing or empty"; exit 1; }
          if grep -Eiq '(\[ERROR\]|API key not valid|GEMINI_API_KEY is not set|Traceback)' ai_briefing.md; then
            echo "AI briefing appears to contain an error. Review analyzer logs."
            exit 1
          fi

      - name: Save news reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-reports
          path: |
            news.json
            daily_briefing.md
            ai_briefing.md
          retention-days: 7

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html news.json daily_briefing.md ai_briefing.md _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
