
name: Daily AI News Collection and Analysis

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect news
        run: python news_collector.py

      - name: Analyze news with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "openrouter/free"
        run: python ai_news_analyzer.py

      - name: Verify generated reports
        run: |
          test -s news.json
          test -s daily_briefing.md
          test -s ai_briefing.md

      - name: Save news reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-reports
          path: |
            news.json
            daily_briefing.md
            ai_briefing.md
          retention-days: 7

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp news.json _site/
          cp daily_briefing.md _site/
          cp ai_briefing.md _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
